jobs:
  - name: write kafka
    conf:
      spark.sql.streaming.checkpointLocation: /tmp
    extract:
      - format: org.apache.spark.sql.kafka010.KafkaSourceProvider
        options:
          kafka.bootstrap.servers: g-dev.yagnaiq.com:9092
          subscribe: etl-batch-add
          stream: true

    load:
      - format: org.apache.spark.sql.kafka010.KafkaSourceProvider
        options:
          kafka.bootstrap.servers: g-dev.yagnaiq.com:9092
          topic: etl-stream-add
          stream: true

