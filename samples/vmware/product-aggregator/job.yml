      - add:
          col: ibUpdateDate
          udf:
            function: timestamp
            col:
              - InstallBase.IBRecordCreationDate

      - add:
          col: installBaseVendorId
          value: 60

      - add:
          col: installBaseVendorName
          value: VMware

      - add:
          col: instance
