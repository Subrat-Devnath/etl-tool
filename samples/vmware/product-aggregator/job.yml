jobs:
  - name: VMware Product Aggregator

    extract:
      - format: org.apache.spark.sql.kafka010.KafkaSourceProvider
        options:
          kafka.bootstrap.servers: g-aws-dev.yagnaiq.com:9092
          subscribe: vmware-product-enriched

    transform:
      - add:
          col: contractStartDate
          ref: InstallBase.ContractStartDate

      - add:
          col: contractEndDate
          ref: InstallBase.ContractEndDate

      - add:
          col: startDate
          ref: QuoteLine.ProductServiceStartDate

      - add:
          col: endDate
          ref: QuoteLine.ProductServiceEndDate

      - add:
          col: contractGroup
          ref: InstallBase.ContractGroup

      - add:
          col: modifier
          ref: InstallBase.ContractModifier

      - add:
          col: number
          ref: InstallBase.ContractNumber

      - struct:
          col:
            - modifier
            - number
          target: contractQuoteDetail

      - add:
          col: contractStatus
          ref: InstallBase.ContractStatus

      - add:
          col: createdDate
          udf:
            function: nowTimestamp

      - add:
          col: createdDateString
          udf:
            function: now

      - add:
          col: createdUserId
          ref: userId()

      - add:
          col: createdUserName
          ref: userName()

      - add:
          col: isDelete
          value: false

      - add:
          col: expiredDate
          udf:
            function: timestamp
            col:
              - QuoteHeader.QuoteExpiration

      - add:
          col: expiredDateString
